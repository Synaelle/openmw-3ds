# The release pipeline on GitLab, from a version tag (like 0.2.0). GitLab's runners build the CIA, the Python package
# and the Linux setup app. The release itself waits for GitHub's release of the same tag to be published, then takes
# its notes and its Windows and macOS setup apps, which only GitHub's runners build. The project's CI/CD settings
# point here (this file), not to OpenMW's own pipeline.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

variables:
  GIT_DEPTH: "1"
  GITHUB_REPO: Synaelle/openmw-3ds

stages:
  - build
  - setup
  - release

cia:
  stage: build
  image: ghcr.io/synaelle/openmw-3ds-deps:latest
  tags: [saas-linux-medium-amd64]
  timeout: 3h
  script:
    - bash 3ds/ci/check-deps.sh
    - bash 3ds/ci/build-cia.sh "$CI_COMMIT_TAG" 3ds/build/openmw-release
    - bash 3ds/ci/package.sh "$CI_COMMIT_TAG" 3ds/build/openmw-release dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

setup-linux:
  stage: setup
  image: rust:1-bookworm
  tags: [saas-linux-medium-amd64]
  needs: [cia]
  timeout: 2h
  variables:
    # No FUSE in a container: the AppImage tools run extracted.
    APPIMAGE_EXTRACT_AND_RUN: "1"
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      libayatana-appindicator3-dev patchelf file nodejs npm unzip
    - mkdir -p 3ds/setup/app/port
    - (cd 3ds/setup/app/port && unzip -q "$CI_PROJECT_DIR/dist/port-$CI_COMMIT_TAG.zip" && test -f cias/openmw3ds.cia)
    - (cd 3ds/setup/app && npx --yes @tauri-apps/cli@2.12.4 build --bundles appimage --config tauri.release.conf.json)
    - folder="OpenMW-3DS-Setup-$CI_COMMIT_TAG"
    - mkdir -p "stage/$folder" dist-setup
    - sed "s/{VERSION}/$CI_COMMIT_TAG/g" 3ds/setup/packaging/README-Linux.txt > "stage/$folder/README.txt"
    - cp 3ds/setup/target/release/bundle/appimage/*.AppImage "stage/$folder/OpenMW-3DS-Setup-x86_64.AppImage"
    - chmod +x "stage/$folder/OpenMW-3DS-Setup-x86_64.AppImage"
    - tar -C stage -czf "dist-setup/OpenMW-3DS-$CI_COMMIT_TAG-Linux.tar.gz" "$folder"
  artifacts:
    paths:
      - dist-setup/
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [cia, setup-linux]
  timeout: 3h
  script:
    - apk add --no-cache bash curl jq
    - bash 3ds/ci/gitlab-release.sh
