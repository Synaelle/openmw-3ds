name: 3ds release

# A release, from its version tag (like 0.2.0). The dependency image is built first when 3ds/deps changed, then the
# CIA, the packages and the setup apps for Windows, macOS and Linux. They go to a draft release, which is published
# only once every file is there: until then nobody sees it, and a failed build leaves it a draft. The draft can be
# made beforehand with its notes, otherwise the release gets a plain one to edit.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPS_IMAGE: ghcr.io/synaelle/openmw-3ds-deps

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          state=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          case "$state" in
            draft) echo "draft $TAG is there" ;;
            published) echo "::error::$TAG is published already, nothing is built over it"; exit 1 ;;
            *) gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "$TAG"; echo "made a plain draft for $TAG" ;;
          esac

  deps:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: The image's tag, from 3ds/deps and the image's Dockerfile
        id: tag
        run: |
          id=$(bash 3ds/ci/deps-id.sh)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "image=$DEPS_IMAGE:deps-${id:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The source label ties the package to this repository, which is what lets this workflow's token create it.
      - name: Build it unless it exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          ID: ${{ steps.tag.outputs.id }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists"
            exit 0
          fi
          docker build -f 3ds/ci/deps.Dockerfile --build-arg "DEPS_ID=$ID" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE" -t "$DEPS_IMAGE:latest" .
          docker push "$IMAGE"
          docker push "$DEPS_IMAGE:latest"

  cia:
    needs: [draft, deps]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.deps.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the dependency image
        run: bash 3ds/ci/check-deps.sh
      - name: Build the CIA
        run: bash 3ds/ci/build-cia.sh "${{ github.ref_name }}" 3ds/build/openmw-release
      - name: Package
        run: bash 3ds/ci/package.sh "${{ github.ref_name }}" 3ds/build/openmw-release dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-cia
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: 3ds/build/openmw-release/openmw.elf
          retention-days: 90

  setup:
    needs: cia
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: macOS
            runner: macos-14
          - platform: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: 3ds/setup
      - name: Linux libraries
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 3ds/setup
      - uses: actions/download-artifact@v4
        with:
          name: release-cia
          path: cia
      - name: The port's files
        run: |
          mkdir -p 3ds/setup/app/port
          cd 3ds/setup/app/port && unzip -q "../../../../cia/port-$TAG.zip"
          test -f cias/openmw3ds.cia
      - name: Build (Windows)
        if: matrix.platform == 'Windows'
        working-directory: 3ds/setup/app
        run: npx --yes @tauri-apps/cli@2.12.4 build --no-bundle
      - name: Build (macOS)
        if: matrix.platform == 'macOS'
        working-directory: 3ds/setup/app
        run: npx --yes @tauri-apps/cli@2.12.4 build --target universal-apple-darwin --bundles app --config tauri.release.conf.json
      - name: Build (Linux)
        if: matrix.platform == 'Linux'
        working-directory: 3ds/setup/app
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles appimage --config tauri.release.conf.json
      - name: Package
        working-directory: 3ds/setup
        run: |
          folder="OpenMW-3DS-Setup-$TAG"
          mkdir -p "stage/$folder" dist
          sed "s/{VERSION}/$TAG/g" "packaging/README-${{ matrix.platform }}.txt" > "stage/$folder/README.txt"
          case "${{ matrix.platform }}" in
            Windows)
              cp target/release/openmw3ds-setup.exe "stage/$folder/"
              cp -r app/port "stage/$folder/port"
              (cd stage && 7z a -tzip -bso0 "../dist/OpenMW-3DS-$TAG-Windows.zip" "$folder")
              ;;
            macOS)
              cp -R "target/universal-apple-darwin/release/bundle/macos/OpenMW 3DS Setup.app" "stage/$folder/"
              # ditto keeps the app's permissions and signature.
              (cd stage && ditto -c -k --keepParent "$folder" "../dist/OpenMW-3DS-$TAG-macOS.zip")
              ;;
            Linux)
              cp target/release/bundle/appimage/*.AppImage "stage/$folder/OpenMW-3DS-Setup-x86_64.AppImage"
              chmod +x "stage/$folder/OpenMW-3DS-Setup-x86_64.AppImage"
              # A tar keeps the AppImage executable.
              tar -C stage -czf "dist/OpenMW-3DS-$TAG-Linux.tar.gz" "$folder"
              ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-setup-${{ matrix.platform }}
          path: 3ds/setup/dist/*

  publish:
    needs: [cia, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Attach the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -la out
          files=$(find out -type f ! -name 'port-*' | sort)
          test "$(echo "$files" | wc -l)" -eq 5
          gh release upload "$TAG" $files --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG"
